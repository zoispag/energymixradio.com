[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  # The build tools (vite, tailwind) are devDependencies. Netlify sets NODE_ENV=production,
  # which would make npm skip them, so ask for them explicitly.
  NPM_CONFIG_INCLUDE = "dev"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
