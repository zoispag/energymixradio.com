[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  # The build tools (vite, tailwind) are devDependencies. Netlify sets NODE_ENV=production,
  # which would make npm skip them, so ask for them explicitly.
  NPM_CONFIG_INCLUDE = "dev"

# Shoutcast's own "current song" endpoint changes the instant the stream does, while the
# Centova control-panel API lags by 20-60s. It has no CORS headers, so proxy it same-origin.
[[redirects]]
  from = "/api/now-playing"
  to = "https://cast.magicstreams.gr/sc/jziwpfyo/currentsong"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
